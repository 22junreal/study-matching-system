# Merge with compose.prod.yml. Only Caddy publishes public ports.
services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your public domain}
      TLS_MODE: ${TLS_MODE:-}
    ports:
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${EDGE_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  gateway:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    environment:
      PORT: ${PORT:-8080}
    volumes:
      - ./edge/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
    logging: *bounded_logs
  backend:
    logging: *bounded_logs
  postgres:
    logging: *bounded_logs
volumes:
  caddy_data:
  caddy_config:
