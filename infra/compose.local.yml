services:
  postgres:
    image: postgres:17
    container_name: study-matching-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - study_matching_postgres_data:/var/lib/postgresql/data

volumes:
  study_matching_postgres_data: