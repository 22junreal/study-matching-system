services:
  postgres:
    image: postgres:17
    container_name: study-matching-postgres
    environment:
      POSTGRES_DB: study_matching
      POSTGRES_USER: study_user
      POSTGRES_PASSWORD: local_password
    ports:
      - "5432:5432"
    volumes:
      - study_matching_postgres_data:/var/lib/postgresql/data

volumes:
  study_matching_postgres_data: