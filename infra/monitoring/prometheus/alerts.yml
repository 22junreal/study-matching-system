groups:
  - name: study-backend
    rules:
      - alert: StudyBackendDown
        expr: up{job="study-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Backend metrics cannot be scraped
          description: Check backend availability, metrics credentials and container networking. This is not a database health check.
      - alert: StudyHigh5xxRate
        expr: |
          (sum(rate(http_server_requests_seconds_count{job="study-backend",uri!~"/actuator.*",status=~"5.."}[5m]))
           / clamp_min(sum(rate(http_server_requests_seconds_count{job="study-backend",uri!~"/actuator.*"}[5m])), 0.001) > 0.05)
          and (sum(rate(http_server_requests_seconds_count{job="study-backend",uri!~"/actuator.*"}[5m])) >= 1)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: API 5xx ratio exceeds 5 percent
          description: Requires at least 1 request per second. Inspect requestId logs and database availability.
      - alert: StudyHighLatency
        expr: |
          (histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="study-backend",uri!~"/actuator.*"}[5m]))) > 1)
          and (sum(rate(http_server_requests_seconds_count{job="study-backend",uri!~"/actuator.*"}[5m])) >= 1)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: API p95 exceeds one second
          description: Requires at least 1 request per second. Check pool contention, GC and slow queries.
      - alert: StudyDatabasePoolWaiting
        expr: hikaricp_connections_pending{job="study-backend"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Requests are waiting for database connections
          description: Check active/max connections and long-running transactions.
