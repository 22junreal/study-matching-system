global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: study-backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password_file: /run/secrets/monitoring.password
    static_configs:
      - targets: ['backend:BACKEND_PORT']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
