# Enable after local/prod, e.g. SPRING_PROFILES_ACTIVE=prod,monitoring.
spring.config.import=optional:configtree:/run/secrets/
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s,5s
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s
management.metrics.web.server.max-uri-tags=100
spring.datasource.hikari.pool-name=StudyPool
management.metrics.distribution.percentiles-histogram.jvm.gc.pause=true
